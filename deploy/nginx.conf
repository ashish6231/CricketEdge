# Include inside nginx's http {} block, behind your existing TLS ingress.
# Start the ingestion/API instance on :5001 and an API-only replica on :5002.
map $http_upgrade $cricedge_connection {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $cricedge_proto {
    default $scheme;
    https https;
}
upstream cricedge_api {
    # Polling fallback requires session affinity in addition to the Redis adapter.
    hash $remote_addr consistent;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
server {
    listen 8080;
    server_name _;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://cricedge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cricedge_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cricedge_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
    }
}
